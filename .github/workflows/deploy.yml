name: Deploy to Production

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  build-website:
    name: Build Next.js Website
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: newskarnataka-website/package-lock.json

      - run: npm install
        working-directory: newskarnataka-website

      - run: npm run lint || true
        working-directory: newskarnataka-website

      - run: npm run build
        working-directory: newskarnataka-website
        env:
          NEXT_PUBLIC_STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_API_TOKEN_FULL_ACCESS: ${{ secrets.STRAPI_API_TOKEN }}

  build-console:
    name: Build React Console
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: newskarnataka-console/package-lock.json

      - run: npm install
        working-directory: newskarnataka-console

      - run: npm run lint || true
        working-directory: newskarnataka-console

      - run: npm run build
        working-directory: newskarnataka-console
        env:
          VITE_STRAPI_URL: ${{ secrets.STRAPI_URL }}
          VITE_STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build-website, build-console]
    
    steps:
      - uses: actions/checkout@v4

      - uses: amondnet/vercel-action@v25
        name: Deploy Website
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
          working-directory: newskarnataka-website

      - uses: amondnet/vercel-action@v25
        name: Deploy Console
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_CONSOLE }}
          working-directory: newskarnataka-console
