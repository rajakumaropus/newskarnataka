name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - name: Install and build website
        working-directory: newskarnataka-website
        run: |
          npm ci --legacy-peer-deps
          npm run build
        env:
          NEXT_PUBLIC_STRAPI_URL: http://103.191.208.235:1337
          STRAPI_API_TOKEN_FULL_ACCESS: ${{ secrets.STRAPI_API_TOKEN }}
      
      - name: Install and build console
        working-directory: newskarnataka-console
        run: |
          npm ci --legacy-peer-deps
          npm run build
        env:
          VITE_STRAPI_URL: http://103.191.208.235:1337
          VITE_STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
      
      - name: Remove stale Vercel metadata
        run: |
          rm -rf newskarnataka-website/.vercel
          rm -rf newskarnataka-console/.vercel
      
      - name: Deploy website to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEBSITE_PROJECT_ID }}
          working-directory: newskarnataka-website
          prod: true
      
      - name: Deploy console to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_CONSOLE_PROJECT_ID }}
          working-directory: newskarnataka-console
          prod: true
