name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Setup Node.js 20 (compatible with Next.js)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      # Step 3: Install and build website
      - name: Install & Build Website
        working-directory: newskarnataka-website
        run: npm install --legacy-peer-deps && npm run build
        env:
          NEXT_PUBLIC_STRAPI_URL: http://103.191.208.235:1337
          STRAPI_API_TOKEN_FULL_ACCESS: ${{ secrets.STRAPI_API_TOKEN }}
      
      # Step 4: Install and build console
      - name: Install & Build Console
        working-directory: newskarnataka-console
        run: npm install --legacy-peer-deps && npm run build
        env:
          VITE_STRAPI_URL: http://103.191.208.235:1337
          VITE_STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
      
      # Step 5: Deploy website to Vercel
      - name: Deploy Website to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
          working-directory: newskarnataka-website
      
      # Step 6: Deploy console to Vercel
      - name: Deploy Console to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_CONSOLE }}
          working-directory: newskarnataka-console
