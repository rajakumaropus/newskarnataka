name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_Hc1spTfjdTMy2FHP8nTmuMJV

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Build website
        working-directory: newskarnataka-website
        run: npm ci --legacy-peer-deps && npm run build
        env:
          NEXT_PUBLIC_STRAPI_URL: http://103.191.208.235:1337
          STRAPI_API_TOKEN_FULL_ACCESS: ${{ secrets.STRAPI_API_TOKEN }}
      
      - name: Build console
        working-directory: newskarnataka-console
        run: npm ci --legacy-peer-deps && npm run build
        env:
          VITE_STRAPI_URL: http://103.191.208.235:1337
          VITE_STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
      
      - name: Deploy website
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEBSITE_PROJECT_ID }}
          working-directory: newskarnataka-website
      
      - name: Deploy console
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_CONSOLE_PROJECT_ID }}
          working-directory: newskarnataka-console
