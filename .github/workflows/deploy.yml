name: Deploy to Production

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '18'

jobs:
  # Lint and build Next.js website
  build-website:
    name: Build Next.js Website
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./newskarnataka-website
        run: npm ci

      - name: Run ESLint
        working-directory: ./newskarnataka-website
        run: npm run lint || true

      - name: Build production
        working-directory: ./newskarnataka-website
        run: npm run build
        env:
          NEXT_PUBLIC_STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_API_TOKEN_FULL_ACCESS: ${{ secrets.STRAPI_API_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: newskarnataka-website/.next

  # Lint and build React console
  build-console:
    name: Build React Console
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        working-directory: ./newskarnataka-console
        run: npm ci

      - name: Run ESLint
        working-directory: ./newskarnataka-console
        run: npm run lint || true

      - name: Build production
        working-directory: ./newskarnataka-console
        run: npm run build
        env:
          VITE_STRAPI_URL: ${{ secrets.STRAPI_URL }}
          VITE_STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: console-build
          path: newskarnataka-console/dist

  # Deploy to Vercel
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build-website, build-console]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Website to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
          working-directory: newskarnataka-website
          alias-domains: |
            newskarnataka-prod.vercel.app

      - name: Deploy Console to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_CONSOLE }}
          working-directory: newskarnataka-console
          alias-domains: |
            newskarnataka-console-prod.vercel.app

  # Notify deployment status
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
            echo "Homepage: https://newskarnataka-prod.vercel.app"
            echo "Console: https://newskarnataka-console-prod.vercel.app"
          else
            echo "❌ Deployment failed!"
          fi
